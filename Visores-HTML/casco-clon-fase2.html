<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Casco Clon Fase 2 (Comandante Thorn) — Visor 3D Interactivo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1a1e24 0%, #0a0c0e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .header-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .back-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .title-block {
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      text-align: right;
    }
    .title-block h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .title-block p { margin: 2px 0 0 0; font-size: 0.75rem; color: #8b949e; }
    .toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(18, 22, 28, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .btn {
      background: transparent;
      border: none;
      color: #e6edf3;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { background: rgba(255,255,255,0.15); transform: scale(0.96); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="header-bar">
    <a href="index.html" class="back-btn">⬅ Volver</a>
    <div class="title-block">
      <h1>Casco Clon Fase 2 (Comandante Thorn)</h1>
      <p>Táctil: 1 dedo rotar | 2 dedos zoom/mover</p>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn" id="btn-auto">⏯ Giro</button>
    <button class="btn" id="btn-wire">🕸 Malla</button>
    <button class="btn" id="btn-center">🎯 Centrar</button>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.6;

    // Iluminacion de estudio 3 puntos
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirKey = new THREE.DirectionalLight(0xfff5ea, 1.3);
    dirKey.position.set(25, 45, 35);
    scene.add(dirKey);

    const dirFill = new THREE.DirectionalLight(0xccddff, 0.55);
    dirFill.position.set(-25, 15, -25);
    scene.add(dirFill);

    const group = new THREE.Group();
    
    // Cupula del casco (Armadura blanca)
    const domeGeo = new THREE.SphereGeometry(15, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62);
    const armorMat = new THREE.MeshStandardMaterial({ color: 0xededed, roughness: 0.35, metalness: 0.1 });
    const domeMesh = new THREE.Mesh(domeGeo, armorMat);
    group.add(domeMesh);

    // Cresta superior (Fin dorsal)
    const crestGeo = new THREE.BoxGeometry(2.4, 4.2, 24);
    const crestMat = new THREE.MeshStandardMaterial({ color: 0xb31919, roughness: 0.4 }); // Rojo Comandante Thorn
    const crestMesh = new THREE.Mesh(crestGeo, crestMat);
    crestMesh.position.set(0, 15.5, -1);
    group.add(crestMesh);

    // Visor T-Shape (Negro brillante)
    const visorMat = new THREE.MeshStandardMaterial({ color: 0x050608, roughness: 0.1, metalness: 0.85 });
    const visorHoriz = new THREE.BoxGeometry(16, 2.8, 4);
    const visorHMesh = new THREE.Mesh(visorHoriz, visorMat);
    visorHMesh.position.set(0, 2, 13.8);
    group.add(visorHMesh);

    const visorVert = new THREE.BoxGeometry(3.2, 9, 4);
    const visorVMesh = new THREE.Mesh(visorVert, visorMat);
    visorVMesh.position.set(0, -3, 13.8);
    group.add(visorVMesh);

    // Mandibula y barbilla
    const jawGeo = new THREE.CylinderGeometry(14.5, 12, 10, 32, 1, true, 0, Math.PI * 2);
    const jawMesh = new THREE.Mesh(jawGeo, armorMat);
    jawMesh.position.set(0, -5, 0);
    group.add(jawMesh);

    // Filtros de mejilla / Aireadores
    const filterGeo = new THREE.CylinderGeometry(1.6, 1.6, 2.5, 16);
    filterGeo.rotateZ(Math.PI / 2);
    const filterMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 });
    const fLeft = new THREE.Mesh(filterGeo, filterMat);
    fLeft.position.set(-10, -7, 10);
    const fRight = new THREE.Mesh(filterGeo, filterMat);
    fRight.position.set(10, -7, 10);
    group.add(fLeft);
    group.add(fRight);

    scene.add(group);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('btn-auto').addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
    });

    let wireframeState = false;
    document.getElementById('btn-wire').addEventListener('click', () => {
      wireframeState = !wireframeState;
      group.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.wireframe = wireframeState;
        }
      });
    });

    document.getElementById('btn-center').addEventListener('click', () => {
      camera.position.set(0, 30, 60);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
